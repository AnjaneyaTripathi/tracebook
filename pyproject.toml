[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tracebook"
version = "0.1.0"
description = "Local diagnostics for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["typer>=0.16,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "tomlkit>=0.13,<1", "orjson>=3.10,<4", "opentelemetry-proto>=1.30,<2", "protobuf>=5,<8"]

[project.scripts]
tracebook = "tracebook.cli:app"
tracebook-hook = "tracebook.hook:main"

[project.entry-points."tracebook.adapters"]
antigravity = "tracebook.adapters.antigravity:AntigravityAdapter"
claude_code = "tracebook.adapters.claude:ClaudeAdapter"
codex = "tracebook.adapters.codex:CodexAdapter"
gemini_cli = "tracebook.adapters.gemini:GeminiAdapter"
generic = "tracebook.adapters.generic:GenericAdapter"
opencode = "tracebook.adapters.opencode:OpenCodeAdapter"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "mypy>=1.15", "ruff>=0.11", "httpx>=0.28", "types-protobuf>=5", "psutil>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/tracebook"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tracebook"]

[[tool.mypy.overrides]]
module = ["opentelemetry.proto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
faulthandler_timeout = 30

[tool.coverage.run]
source = ["tracebook"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

